<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="min-h-screen bg-gradient-to-br from-blue-600 via-indigo-600 to-purple-700 flex items-center justify-center px-4">

    <form id="change-password" class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8 space-y-6">
        <div class="text-center">
            <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-indigo-100">
                <svg
                    class="h-8 w-8 text-indigo-600"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M12 15v2m-6 4h12a2 2 0 002-2v-7a2 2 0 00-2-2H6a2 2 0 00-2 2v7a2 2 0 002 2zm3-9V7a3 3 0 016 0v3"/>
                </svg>
            </div>

            <h2 class="text-3xl font-bold text-gray-800">Change Password</h2>
            <p class="mt-2 text-sm text-gray-500">Create a new password for your account.</p>
        </div>
        <p id="feedback" class="text-center text-sm font-medium text-red-500"></p>

        <div>
            <label for="new_password" class="mb-2 block text-sm font-medium text-gray-700">New Password</label>
            <input type="password" id="new_password" name="new_password" placeholder="Enter your new password" required 
            class="w-full rounded-xl border border-gray-300 bg-gray-50 px-4 py-3 text-gray-800 outline-none transition duration-200 
            placeholder:text-gray-400 focus:border-indigo-500 focus:bg-white focus:ring-4 focus:ring-indigo-100">
        </div>
        <div>
            <label for="confirm_password" class="mb-2 block text-sm font-medium text-gray-700" > Confirm Password </label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your new password" required
            class="w-full rounded-xl border border-gray-300 bg-gray-50 px-4 py-3 text-gray-800 
            outline-none transition duration-200 placeholder:text-gray-400 focus:border-indigo-500 focus:bg-white 
            focus:ring-4 focus:ring-indigo-100">
        </div>
        <p class="text-xs text-gray-500"> Make sure your password is strong and easy for you to remember.</p>
        <button type="submit" id="submit"class="w-full rounded-xl bg-indigo-600 px-4 py-3 font-semibold 
        text-white shadow-lg transition duration-200 hover:bg-indigo-700 hover:shadow-xl focus:outline-none 
        focus:ring-4 focus:ring-indigo-300 active:scale-[0.98]">Change Password</button>
        <div class="text-center">
            <a href="/login"
                class="text-sm font-medium text-indigo-600 transition hover:text-indigo-800 hover:underline">
                ← Back to Login
            </a>
        </div>

    </form>

    <script src="{{ url_for('static', filename='js/changepassword.js') }}"></script>

</body>
</html>
