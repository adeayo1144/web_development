<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"href="{{url_for('static',filename='css/style.css')}}">
</head>
<body class="bg-gray-100">

<div class="min-h-screen flex items-center justify-center">
    <form id="login" class= "bg-white p-8 rounded-xl shadow-lg w-96">

        <h2 class="text-3xl font-bold text-center mb-6">Login</h2>

        <input type="email" id="email" placeholder="Email"
               class="w-full p-3 border rounded-lg mb-4">

        <input type="password" id="password" placeholder="Password"
               class="w-full p-3 border rounded-lg mb-4">

        <button id="submit" class="bg-blue-600 text-white px-6 py-3 rounded-lg w-full">Login</button>

        <p class="text-center mt-4">
            <a href="/forgot-password" class="text-blue-600">
                Forgot Password?
            </a>
        </p>

        <p class="text-center mt-2">
            Don't have an account?
            <a href="/register" class="text-blue-600">
                Register
            </a>
        </p>

    </form>
</div>
    <script src="{{url_for('static',filename='js/login.js')}}"></script>
</body>
</html>
