<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black flex items-center justify-center min-h-screen">

    <form id="register"
          class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md mx-4">

        <p id="feedback"
           class="text-sm text-red-500 mb-4 hidden"></p>

        <h2 class="text-2xl font-bold text-gray-800 text-center mb-6">
            Register
        </h2>
        <div class="mb-4">
            <label for="firstname"class="block text-sm font-semibold text-gray-600 mb-1">First Name</label>
            <input type="text" id="firstname" placeholder="First Name" class="w-full p-3 border rounded-lg mb-4">
        </div>
        <div class="mb-4">
            <label for="lastname"class="block text-sm font-semibold text-gray-600 mb-1">Last Name</label>
            <input type="text" id="lastname" placeholder="Last Name"class="w-full p-3 border rounded-lg mb-4">
        </div>

        <div class="mb-4">
            <label for="email" class="block text-sm font-semibold text-gray-600 mb-1">Email</label>
            <input type="email" id="email" placeholder="Email"class="w-full p-3 border rounded-lg mb-4">
        </div>

        <div class="mb-6">
            <label for="password" class="block text-sm font-semibold text-gray-600 mb-1"> Password </label>
            <input type="password"id="password" placeholder="Password" class="w-full p-3 border rounded-lg mb-4">
        </div>


        <button id="submit" type="submit"class="bg-black text-white px-6 py-3 
        rounded-lg w-full hover:bg-gray-900 transition">Register</button>

        <!-- Login -->
        <p class="text-sm text-gray-600 text-center mt-4">
            Already have an account?
            <a href="/login"
               class="text-blue-600 hover:text-blue-700
                      hover:underline font-medium">
                Login
            </a>
        </p>

    </form>

    <!-- Your JavaScript -->
    <script src="{{ url_for('static', filename='js/register.js') }}"></script>

</body>
</html>
