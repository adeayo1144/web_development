<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="bg-black flex items-center justify-center min-h-screen">

    <form id="forgot-password" class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8 space-y-6">
        <div class="text-center">
            <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-indigo-100">
                <svg class="h-8 w-8 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M12 11c0 3.866-3.582 7-8 7m16-7c0 3.866-3.582 7-8 7m0-14a4 4 0 100 8 4 4 0 000-8z"/>
                </svg>
            </div>

            <h2 class="text-3xl font-bold text-gray-800">
                Forgot Password?
            </h2>

            <p class="mt-2 text-sm text-gray-500">Enter your email and we'll send you a link to reset your password.</p>
        </div>
        <p id="feedback" class="text-center text-sm font-medium text-red-500"></p>

        <div>
            <label for="email" class="mb-2 block text-sm font-medium text-gray-700">Email Address </label>
            <input type="email" name="email" id="email" placeholder="Enter your email" required class="w-full rounded-xl border 
            border-gray-300 bg-gray-50 px-4 py-3 text-gray-800 outline-none transition duration-200 
            placeholder:text-gray-400 focus:border-indigo-500 focus:bg-white focus:ring-4 focus:ring-indigo-100">
        </div>
        <button id="submit" type="submit"class="bg-black text-white px-6 py-3 
        rounded-lg w-full hover:bg-gray-900 transition"> Forgot Password</button>

        <div class="text-center">
            <a href="/login" class="text-sm font-medium text-indigo-600 transition hover:text-indigo-800 hover:underline">
                ← Back to Login
            </a>
        </div>
    </form>
    <script src="{{ url_for('static', filename='js/forgotpassword.js') }}"></script>
</body>
</html>
